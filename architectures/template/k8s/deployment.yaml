apiVersion: apps/v1
kind: Deployment
metadata:
  name: template-app
  namespace: template-arch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: template-app
  template:
    metadata:
      labels:
        app: template-app
    spec:
      containers:
        - name: template-app
          image: node:20-alpine
          command: ["node", "-e", "const http = require('http'); http.createServer((req, res) => { res.writeHead(200); res.end('Template response'); }).listen(8080);"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
