name: Require PR Check

on:
  push:
    branches:
      - main

jobs:
  enforce-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Block direct pushes to main
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ -z "${{ github.event.pull_request.number }}" ]; then
            echo "❌ Direct pushes to main are not allowed. Please open a Pull Request."
            exit 1
          fi
