name: Build and Push to GHCR

on:
  push:
    tags:
      - 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest

      # Convert repository name to lowercase since Docker doesn't support uppercase in image names
      - name: Downcase REPO name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Cross-compile for Raspberry Pi's arm64 architecture
          platforms: linux/arm64
          tags: ghcr.io/${{ env.REPO }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO }}:buildcache,mode=max

      # Trigger Watchtower webhook for instant updating!
      - name: Trigger Watchtower Webhook
        run: |
          curl -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
               ${{ secrets.WATCHTOWER_URL }}/v1/update
